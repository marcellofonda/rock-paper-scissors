[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-rps"
version = "0.1.0"
description = "A small Bayesian Rock-Paper-Scissors player"
requires-python = ">=3.8"
dependencies = [
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bayesian-rps = "bayesian_rps.cli:main"
bayesian-rps-play = "bayesian_rps.play_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
